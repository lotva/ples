<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ples playground — page two, core only</title>
    <script src="/runtime.iife.js"></script>
    <link rel="stylesheet" href="/ples.css" />
    <link rel="stylesheet" href="/effects/relax.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      section {
        margin-block-end: 3rem;
      }
      nav a {
        margin-inline-end: 1rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">page one</a>
      <a href="page-two-core-only.html">page two core-only</a>
    </nav>

    <section id="default" data-ples data-ples-effect="slide">
      <h1>Page two, core only</h1>
      <p>No ples/navigation — navigate=false attributes are ignored.</p>
    </section>

    <section
      id="opted-out-element"
      data-ples
      data-ples-navigate="false"
      data-ples-effect="relax"
    >
      <h1>Marked navigate=false</h1>
      <p>Still animates: the navigation addon is not loaded.</p>
    </section>
  </body>
</html>
