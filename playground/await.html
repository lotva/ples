<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ples await</title>
    <script src="/runtime.iife.js"></script>
    <script src="/await.iife.js"></script>
    <link rel="stylesheet" href="/ples.css" />
    <link rel="stylesheet" href="/await.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      section {
        margin-block-end: 3rem;
      }
      .spacer {
        height: 120vh;
      }
      img,
      video {
        display: block;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <section id="copy" data-ples data-ples-effect="slide">
      <h1>No media</h1>
      <p>Reveals as soon as the coordinator runs.</p>
    </section>

    <section id="photo" data-ples data-ples-effect="slide">
      <h1>Slow image</h1>
      <img src="/slow.png" width="32" height="32" alt="" />
    </section>

    <section id="broken" data-ples data-ples-effect="slide">
      <h1>Broken image</h1>
      <img src="/missing.png" width="32" height="32" alt="" />
    </section>

    <section id="clip" data-ples data-ples-effect="slide">
      <h1>Broken video</h1>
      <video
        src="/missing.mp4"
        width="32"
        height="32"
        muted
        playsinline
      ></video>
    </section>

    <section id="held" data-ples data-ples-effect="slide">
      <h1>preload=none video</h1>
      <video
        src="/slow.mp4"
        width="32"
        height="32"
        muted
        playsinline
        preload="none"
      ></video>
    </section>

    <div class="spacer"></div>

    <section id="lazy" data-ples data-ples-effect="slide">
      <h1>Lazy image</h1>
      <img src="/slow.png?lazy" width="32" height="32" alt="" loading="lazy" />
    </section>

    <section
      id="paired"
      data-ples
      data-ples-await="copy"
      data-ples-effect="slide"
    >
      <h1>Own media and await</h1>
      <img src="/slow.png?and" width="32" height="32" alt="" />
    </section>

    <section
      id="caption"
      data-ples
      data-ples-await="photo"
      data-ples-effect="slide"
    >
      <h1>Waits for photo</h1>
      <p>Stays hidden until #photo is ples-ready.</p>
    </section>

    <section
      id="orphan"
      data-ples
      data-ples-await="missing"
      data-ples-effect="slide"
    >
      <h1>Missing target</h1>
      <p>Unknown id fails open.</p>
    </section>

    <div>
      <section
        id="ping"
        data-ples
        data-ples-await="pong"
        data-ples-effect="slide"
      >
        <h1>Cycle ping</h1>
      </section>

      <section
        id="pong"
        data-ples
        data-ples-await="ping"
        data-ples-effect="slide"
      >
        <h1>Cycle pong</h1>
      </section>
    </div>
  </body>
</html>
