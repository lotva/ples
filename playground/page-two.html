<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ples playground — page two</title>
    <script src="/runtime.iife.js"></script>
    <script src="/navigation.iife.js"></script>
    <link rel="stylesheet" href="/ples.css" />
    <link rel="stylesheet" href="/effects/relax.css" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 32rem;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      section {
        margin-block-end: 3rem;
      }
      nav a {
        margin-inline-end: 1rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">page one</a>
      <a href="page-two.html">page two</a>
      <a href="page-config-disabled.html">page config-disabled</a>
      <a href="page-markup-disabled.html">page markup-disabled</a>
      <a href="page-reload-disabled.html">page reload-disabled</a>
      <a href="page-view-transition.html">page view-transition</a>
    </nav>

    <!--
			Default settings, no listen() options — arriving here from page
			one is an in-app transition, and it animates by default just
			like a fresh visit does.
		-->
    <section id="default" data-ples data-ples-effect="slide">
      <h1>Page two</h1>
      <p>Animates on an in-app transition by default.</p>
    </section>

    <!--
			This one opts out individually, overriding the animate-by-default
			behavior for just this element.
		-->
    <section
      id="opted-out-element"
      data-ples
      data-ples-navigate="false"
      data-ples-effect="relax"
    >
      <h1>Opted out per element</h1>
      <p>Stays instant, despite the animate-by-default behavior.</p>
    </section>
  </body>
</html>
